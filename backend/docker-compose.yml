services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://chat:chat@db:5432/chat
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: production
    init: true
    env_file: .env
    environment: # these override whatever is in .env
      NODE_ENV: production
      PORT: "10000"
      DATABASE_URL: postgresql://chat:chat@db:5432/chat
    ports:
      - "5000:10000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
